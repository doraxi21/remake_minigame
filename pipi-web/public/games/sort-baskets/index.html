<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sort Baskets - Pipi</title>
    <link rel="stylesheet" href="../shared/base.css">
    <link rel="stylesheet" href="../shared/pipi.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="shell game-shell game-sort-baskets">
      <div class="topbar">
        <a class="brand" href="../index.html">
          <img src="../assets/pipi/logo.gif" alt="Pipi">
          Pipi Mini Games
        </a>
        <a class="home-link" href="../index.html">Trang chọn game</a>
      </div>

      <section class="game-board">
        <aside class="pipi-panel" data-pipi-panel>
          <button class="pipi-button pipi-frame" data-pipi-button data-pipi-frame type="button" aria-label="Chạm Pipi">
            <img class="pipi-media" src="../assets/png/hello.gif" alt="Pipi">
          </button>
          <p class="speech" data-pipi-speech>Kéo hình vào đúng bảng nhé.</p>
        </aside>

        <section class="activity-card" data-game-root></section>
      </section>
    </main>

    <script src="../shared/audio.js"></script>
    <script src="../shared/pipi.js"></script>
    <script src="../shared/utils.js"></script>
    <script src="../shared/game-runtime.js"></script>
    <script src="../shared/content.js"></script>
    <script src="game.js"></script>
    <script>
      const pipi = PipiMascot.create({ root: document, assetBase: "../" });
      PipiGames.sortBaskets.mount(document.querySelector("[data-game-root]"), {
        guideText: "Kéo hình vào đúng bảng",
        checkText: "Let's check",
        groups: [
          {
            id: "food",
            theme: "food",
            label: "Food",
            vi: "đồ ăn",
            icon: "🍽️",
            items: PipiContent.vocabulary.filter((item) => ["apple", "banana"].includes(item.word))
          },
          {
            id: "animals",
            theme: "animals",
            label: "Animals",
            vi: "con vật",
            icon: "🐾",
            items: PipiContent.vocabulary.filter((item) => ["cat", "dog", "fish"].includes(item.word))
          }
        ]
      }, { pipi });
    </script>
  </body>
</html>
