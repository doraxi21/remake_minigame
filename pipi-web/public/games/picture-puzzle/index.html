<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Picture Puzzle - Pipi</title>
    <link rel="stylesheet" href="../shared/base.css">
    <link rel="stylesheet" href="../shared/pipi.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="shell game-shell game-picture-puzzle">
      <div class="topbar">
        <a class="brand" href="../index.html">
          <img src="../assets/pipi/logo.gif" alt="Pipi">
          Pipi Mini Games
        </a>
        <a class="home-link" href="../index.html">Trang chọn game</a>
      </div>

      <section class="game-board">
        <aside class="pipi-panel" data-pipi-panel>
          <button class="pipi-button pipi-frame" data-pipi-button data-pipi-frame type="button" aria-label="Chạm Pipi">
            <img class="pipi-media" src="../assets/png/hello.gif" alt="Pipi">
          </button>
          <p class="speech" data-pipi-speech>Mở mảnh ghép và chọn nghĩa đúng nhé.</p>
        </aside>

        <section class="activity-card" data-game-root></section>
      </section>
    </main>

    <script src="../shared/audio.js"></script>
    <script src="../shared/pipi.js"></script>
    <script src="../shared/utils.js"></script>
    <script src="../shared/game-runtime.js"></script>
    <script src="../shared/content.js"></script>
    <script src="game.js"></script>
    <script>
      const pipi = PipiMascot.create({ root: document, assetBase: "../" });
      PipiGames.picturePuzzle.mount(document.querySelector("[data-game-root]"), {
        // Đổi tay tại đây: 2 = 2x2, 3 = 3x3, 4 = 4x4.
        difficulty: 2,
        items: PipiContent.vocabulary.filter((item) => ["apple", "banana", "cat", "dog", "cake", "kite"].includes(item.word))
      }, { pipi });
    </script>
  </body>
</html>
